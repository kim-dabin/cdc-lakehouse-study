# Optional learner UI. Run after the main environment is ready:
# ./scripts/lab.sh -f compose.yaml -f compose.observers.yaml up -d --no-deps kafka-ui
# ./scripts/lab.sh -f compose.yaml -f compose.observers.yaml up -d --build --no-deps explorer
services:
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m
      KAFKA_CLUSTERS_0_NAME: cdc-study
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
      MCP_ENABLED: "false"
      GITHUB_RELEASE_INFO_ENABLED: "false"
    ports:
      - "127.0.0.1:28082:8080"
    mem_limit: 512m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      kafka:
        condition: service_healthy
  explorer:
    build:
      context: .
      dockerfile: tools/explorer/Dockerfile
    image: cdc-study-explorer:0.1
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lab_minio}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lab_minio_password}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      SPARK_HOST: spark
      SPARK_PORT: "10000"
      S3_ENDPOINT: http://minio:9000
      WAREHOUSE_BUCKET: warehouse
      MAX_ROWS: "500"
      QUERY_TIMEOUT_SECONDS: "60"
    ports:
      - "127.0.0.1:28090:8000"
    mem_limit: 512m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
