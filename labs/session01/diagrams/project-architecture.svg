<rect x="52" y="659" width="400" height="112" rx="14" fill="#fff6e8" stroke="#d6dfec"/>
<text x="70" y="691" class="label" text-anchor="start">Iceberg JDBC Catalog</text>
<text x="70" y="719" class="body" text-anchor="start">catalog-db: 현재 메타데이터 위치 관리</text>
<text x="70" y="742" class="body" text-anchor="start">Flink · Spark가 같은 카탈로그 사용</text>
<rect x="490" y="659" width="450" height="112" rx="14" fill="#fff6e8" stroke="#d6dfec"/>
<text x="508" y="691" class="label" text-anchor="start">MinIO · S3 호환 저장소</text>
<text x="508" y="719" class="body" text-anchor="start">Bronze / Silver / Gold의 Parquet + metadata</text>
<text x="508" y="742" class="body" text-anchor="start">파일은 MinIO · 포인터는 catalog-db</text>
<rect x="978" y="659" width="406" height="112" rx="14" fill="#fff6e8" stroke="#d6dfec"/>
<text x="996" y="691" class="label" text-anchor="start">Flink checkpoint 볼륨</text>
<text x="996" y="719" class="body" text-anchor="start">소스 위치 · 처리 상태 보관</text>
<text x="996" y="742" class="body" text-anchor="start">복구 실습은 후속 회차</text>
<text x="52" y="814" class="label" text-anchor="start">오늘은 원천 변경과 Kafka·Bronze 수집 결과를 대조</text>
<text x="52" y="844" class="body" text-anchor="start">같은 환불의 INSERT → UPDATE → DELETE → 원천·Kafka·Bronze 내용과 수집 위치 확인</text>
<text x="52" y="872" class="small" text-anchor="start">학생 작성: 공통 SELECT · 변경 이벤트 예측 · before/after·offset·copies 관찰 기록</text>
<text x="42" y="937" class="label" text-anchor="start">오늘 확인: 환불 20,000원 생성 → 30,000원 정정 → 환불 행 삭제</text>
<text x="42" y="970" class="sub" text-anchor="start">결제 100,000원은 준비 데이터입니다. Silver·Gold 갱신은 후속 회차, 개인 프로젝트 설계는 3회차에 진행합니다.</text>
</svg>
