<text x="70" y="412" class="body" text-anchor="start">INSERT · UPDATE · DELETE</text>
<rect x="330" y="329" width="236" height="113" rx="14" fill="#fff" stroke="#d6dfec"/>
<text x="348" y="361" class="label" text-anchor="start">Debezium + Kafka</text>
