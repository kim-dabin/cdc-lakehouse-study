<path d="M625,205 L625,235" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="52" y="329" width="236" height="113" rx="14" fill="#fff" stroke="#d6dfec"/>
<text x="70" y="361" class="label" text-anchor="start">PostgreSQL</text>
