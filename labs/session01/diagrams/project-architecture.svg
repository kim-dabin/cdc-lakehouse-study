<text x="348" y="575" class="body" text-anchor="start">수정 / 삭제 / 재전달 처리</text>
<rect x="608" y="492" width="236" height="113" rx="14" fill="#e3efff" stroke="#d6dfec"/>
<text x="626" y="524" class="label" text-anchor="start">Iceberg Silver</text>
<text x="626" y="552" class="body" text-anchor="start">키별 현재 상태</text>
<text x="626" y="575" class="body" text-anchor="start">삭제 표시 + 원천 버전</text>
<rect x="886" y="492" width="236" height="113" rx="14" fill="#fff" stroke="#d6dfec"/>
<text x="904" y="524" class="label" text-anchor="start">dbt + Spark</text>
<text x="904" y="552" class="body" text-anchor="start">모델 의존성 · 집계 SQL</text>
<text x="904" y="575" class="body" text-anchor="start">고유성 · NULL · 금액 검증</text>
<rect x="1158" y="492" width="226" height="113" rx="14" fill="#dcf4ea" stroke="#d6dfec"/>
<text x="1176" y="524" class="label" text-anchor="start">Iceberg Gold</text>
<text x="1176" y="552" class="body" text-anchor="start">분석 마트 · SQL 조회</text>
<text x="1176" y="575" class="body" text-anchor="start">후속 회차에서 구현·갱신</text>
<path d="M288,548 L322,548" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M566,548 L600,548" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
