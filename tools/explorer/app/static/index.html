<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakehouse Explorer</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#193149;background:#f3f6fa;font-size:15px;line-height:1.5}*{box-sizing:border-box}body{margin:0}body.present{font-size:20px}header{padding:16px 24px 10px;background:white;border-bottom:1px solid #dce5ee}.top,.toolbar,.status,nav,.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{font-size:1.55em;margin:0 auto 0 0;letter-spacing:-.04em}.badge{background:#e7f5ed;color:#226247;border-radius:20px;padding:3px 12px;font-size:.85em}.status{font-size:.85em;margin-top:8px;color:#526579}.status span{max-width:100%;overflow-wrap:anywhere}.ok{color:#226247}.fail,.error{color:#a52b35}button,select{font:inherit;color:inherit;background:white;border:1px solid #c4d2df;border-radius:7px;padding:7px 12px;cursor:pointer}button:hover{background:#edf3fb}button:disabled{opacity:.5;cursor:wait}button.primary{background:#235ccd;color:white;border-color:#235ccd}nav{padding:12px 24px;gap:6px}nav button[aria-selected=true]{background:#193149;color:white;border-color:#193149}main{padding:0 24px 20px}section[hidden]{display:none}.card{background:white;border:1px solid #dce5ee;border-radius:10px;padding:16px;margin-bottom:12px;min-width:0}.sql-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.examples button,.history button{display:block;width:100%;text-align:left;margin:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9em}.examples{max-height:65vh;overflow:auto}#examples button{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.35}h2{font-size:1.08em;margin:0 0 10px}h3{font-size:1em;margin:16px 0 8px}p{margin:8px 0}textarea{display:block;width:100%;min-height:170px;resize:vertical;border:1px solid #bac9da;border-radius:7px;padding:12px;font:1em/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#17314e;background:#fbfcff;margin:10px 0}.toolbar{justify-content:flex-start}.muted{color:#647587;font-size:.9em}.table-scroll{overflow:auto;max-height:45vh;border:1px solid #e1e7ef;border-radius:6px}table{border-collapse:collapse;width:100%;font-size:.9em}th,td{padding:9px 12px;border-bottom:1px solid #e6edf3;text-align:left;vertical-align:top;white-space:nowrap}th{position:sticky;top:0;background:#edf3fa;z-index:1}td{max-width:460px;overflow:hidden;text-overflow:ellipsis}.path{display:inline-block;max-width:440px;vertical-align:bottom;overflow:hidden;text-overflow:ellipsis;color:#235ccd;text-decoration:underline;cursor:pointer}.error pre,pre{white-space:pre-wrap;overflow-wrap:anywhere;font: .9em/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;margin:6px 0}details{padding:4px 0}summary{cursor:pointer;overflow-wrap:anywhere}.tree{padding-left:18px;border-left:1px solid #e2e8ef;overflow-wrap:anywhere}.tree .leaf{padding:3px 0}.crumbs{padding:8px 0}.crumbs button{font-size:.9em;padding:4px 9px}.notice{padding:8px 0;color:#526579}.file-meta{overflow-wrap:anywhere}.file-meta strong{display:block}.empty{padding:16px;color:#647587}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6c99ef;outline-offset:2px}@media(max-width:800px){header,main{padding-left:12px;padding-right:12px}nav{padding-left:12px}.sql-layout{grid-template-columns:1fr}.examples{max-height:160px}.path{max-width:240px}.table-scroll{max-height:50vh}}
</style>
</head>
<body>
<header>
<div class="top"><h1>Lakehouse Explorer</h1><span class="badge">조회 전용</span><button id="font">글자 크게 · 발표</button></div>
<div class="status" aria-live="polite"><span id="spark-state">Spark Thrift 확인 중</span><span id="minio-state">MinIO 확인 중</span><button id="health">연결 확인</button></div>
<div id="version" class="muted"></div>
</header>
<nav role="tablist" aria-label="탐색 메뉴"><button role="tab" id="tab-sql" aria-controls="sql" aria-selected="true" data-tab="sql">SQL</button><button role="tab" id="tab-tables" aria-controls="tables" aria-selected="false" data-tab="tables">테이블</button><button role="tab" id="tab-files" aria-controls="files" aria-selected="false" data-tab="files">파일</button></nav>
<main>
<section id="sql" role="tabpanel" aria-labelledby="tab-sql">
<div class="sql-layout"><aside class="card examples"><h2>예제</h2><div id="examples"></div><h3>최근 실행</h3><div id="history" class="history"></div></aside>
<div><div class="card"><h2>SQL 조회</h2><p class="muted">조회 전용이에요. SELECT, SHOW, DESCRIBE 등으로 조회할 수 있어요.</p><label for="editor" class="muted">SQL 입력</label><textarea id="editor" spellcheck="false">SHOW NAMESPACES IN lake</textarea><div class="toolbar"><button id="run" class="primary">실행</button><label for="max-rows">표시할 행</label><select id="max-rows"><option>50</option><option selected>200</option><option>500</option></select><span class="muted">Ctrl/Cmd+Enter</span><span id="elapsed" class="muted" aria-live="polite"></span></div></div><div id="sql-result" class="card" aria-live="polite">예제를 고르고 실행해 보세요.</div></div></div>
</section>
<section id="tables" role="tabpanel" aria-labelledby="tab-tables" hidden>
<div class="card"><h2>테이블에서 파일로</h2><div class="toolbar"><label for="namespace">네임스페이스</label><select id="namespace"><option value="">선택해 주세요</option></select><label for="table-name">테이블</label><select id="table-name"><option value="">선택해 주세요</option></select><button id="reload-tables">목록 새로고침</button></div><div id="table-status" aria-live="polite"></div></div>
<div class="card"><h2>최근 스냅샷</h2><div id="snapshots">테이블을 선택해 주세요.</div></div><div class="card"><h2>현재 데이터 파일</h2><div id="data-files"></div></div><div class="card"><h2>메타데이터 파일 이력</h2><div id="metadata-log"></div></div>
</section>
<section id="files" role="tabpanel" aria-labelledby="tab-files" hidden>
<div class="card"><div class="toolbar"><h2>warehouse 파일</h2><button id="reload-files">목록 새로고침</button></div><div id="breadcrumbs" class="crumbs" aria-label="현재 폴더"></div><div id="file-list" aria-live="polite"></div><div class="toolbar" style="margin-top:10px"><button id="previous-page" hidden>이전 1000개</button><button id="next-page" hidden>다음 1000개</button></div></div>
<div id="preview" class="card" aria-live="polite">파일을 선택하면 내용을 볼 수 있어요.</div>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function button(text,action){const n=el('button',text);n.type='button';n.addEventListener('click',action);return n;}
async function api(url,options){const response=await fetch(url,options);let data;try{data=await response.json();}catch{throw Error('응답을 읽지 못했어요. 연결을 확인해 주세요.');}if(!response.ok||data.error)throw Error(data.error||'요청을 마치지 못했어요.');return data;}
function error(target,e){target.replaceChildren();const message=String(e.message||e);if(message.length>300){const d=el('details',undefined,'error');d.append(el('summary',message.slice(0,180)+'…'),el('pre',message));target.append(d);}else target.append(el('pre',message,'error'));}
function valueText(value){return value===null?'NULL':typeof value==='object'?JSON.stringify(value):String(value);}
function appendValue(parent,value){
 if(typeof value==='string'&&/^s3a?:\/\/warehouse\/.+/.test(value)){const a=el('a',value,'path');a.href='#files';a.title=value;a.addEventListener('click',e=>{e.preventDefault();openPath(value);});parent.append(a);}
 else if(value&&typeof value==='object'){const d=el('details');d.append(el('summary',valueText(value)));d.append(jsonTree(value));parent.append(d);}
 else{const text=valueText(value);parent.append(el('span',text));parent.title=text;}
}
function grid(target,columns,rows){target.replaceChildren();if(!rows.length){target.append(el('p','결과가 없어요.','empty'));return;}const scroll=el('div',undefined,'table-scroll'),table=el('table'),head=el('thead'),tr=el('tr');columns.forEach(c=>tr.append(el('th',c)));head.append(tr);table.append(head);const body=el('tbody');rows.forEach(row=>{const tr=el('tr');row.forEach(v=>{const td=el('td');appendValue(td,v);tr.append(td);});body.append(tr);});table.append(body);scroll.append(table);target.append(scroll);}
function resultTable(target,result){grid(target,result.columns,result.rows);if(result.truncated)target.prepend(el('p',`앞 ${result.rows.length}행만 보여요.`,'notice'));}
function recordTable(target,records){const columns=[...new Set(records.flatMap(r=>Object.keys(r)))];grid(target,columns,records.map(r=>columns.map(c=>r[c]??null)));}
function jsonTree(value){const root=el('div',undefined,'tree');if(!value||typeof value!=='object'){appendValue(root,value);return root;}Object.entries(value).forEach(([key,item])=>{if(item&&typeof item==='object'){const d=el('details');d.append(el('summary',`${key} (${Array.isArray(item)?item.length:Object.keys(item).length})`),jsonTree(item));root.append(d);}else{const row=el('div',undefined,'leaf');row.append(el('strong',key+': '));appendValue(row,item);root.append(row);}});return root;}
let namespacesLoaded=false,filesLoaded=false;
function tab(name){document.querySelectorAll('[role=tabpanel]').forEach(n=>n.hidden=n.id!==name);document.querySelectorAll('[data-tab]').forEach(n=>n.setAttribute('aria-selected',String(n.dataset.tab===name)));if(name==='tables'&&!namespacesLoaded)loadNamespaces();if(name==='files'&&!filesLoaded)loadFiles('');}
document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>tab(n.dataset.tab));
$('font').onclick=()=>{const big=document.body.classList.toggle('present');$('font').textContent=big?'글자 보통':'글자 크게 · 발표';};
async function health(){const b=$('health');b.disabled=true;try{const h=await api('/api/health');for(const [key,label]of [['spark','Spark Thrift'],['minio','MinIO']]){const v=h[key],n=$(key+'-state');n.textContent=`${label} ${v.ok?'정상':'실패'} · ${new Date(v.checked_at).toLocaleTimeString('ko-KR')}`;n.className=v.ok?'ok':'fail';n.title=v.error||'연결됐어요.';}$('version').textContent=h.spark.version?'Spark '+h.spark.version:'';}catch(e){$('spark-state').textContent='Spark Thrift 확인 실패';$('minio-state').textContent='MinIO 확인 실패';$('spark-state').className=$('minio-state').className='fail';$('version').textContent=e.message;}finally{b.disabled=false;}}
$('health').onclick=health;
const examples=[
 ['네임스페이스','SHOW NAMESPACES IN lake'],
 ...['bronze','silver','gold'].map(ns=>[ns+' 테이블',`SHOW TABLES IN lake.${ns}`]),
 ['Bronze 토픽별 건수',"SELECT 'orders' AS bronze_table, count(*) AS row_count FROM lake.bronze.orders UNION ALL SELECT 'payments', count(*) FROM lake.bronze.payments UNION ALL SELECT 'refunds', count(*) FROM lake.bronze.refunds"],
 ['Silver 현재 상태 · 환불','SELECT * FROM lake.silver.refunds'],
 ['Silver core · 주문 dim','SELECT * FROM lake.silver.dim_order ORDER BY order_id'],
 ['Silver core · 결제 fact','SELECT * FROM lake.silver.fct_payment ORDER BY payment_id'],
 ['Silver core · 환불 fact','SELECT * FROM lake.silver.fct_refund ORDER BY refund_id'],
 ['O-001 따라가기',"SELECT * FROM lake.gold.mart_order_settlement WHERE order_id = 'O-001'"],
 ['Gold 주문 마트','SELECT * FROM lake.gold.mart_order_settlement ORDER BY order_id'],
 ['Gold 일별 마트','SELECT * FROM lake.gold.mart_daily_settlement ORDER BY order_date'],
 ['테이블 상세','DESCRIBE TABLE EXTENDED lake.gold.mart_order_settlement'],
 ['주문 마트 스냅샷','SELECT committed_at, snapshot_id, parent_id, operation FROM lake.gold.mart_order_settlement.snapshots ORDER BY committed_at DESC LIMIT 10'],
 ['환불 데이터 파일','SELECT file_path, record_count, file_size_in_bytes FROM lake.silver.refunds.files'],
 ['환불 매니페스트','SELECT * FROM lake.silver.refunds.manifests'],
 ['환불 메타데이터 이력','SELECT * FROM lake.silver.refunds.metadata_log_entries'],
 ['환불 스냅샷 이력','SELECT * FROM lake.silver.refunds.history'],
 ["6회차 · s2 주문별 Gold", "SELECT * FROM lake.lesson06.s06_demo_s2_gold_order ORDER BY order_id"],
 ["6회차 · s3 주문별 Gold · o1 환불 정정", "SELECT * FROM lake.lesson06.s06_demo_s3_gold_order ORDER BY order_id"],
 ["6회차 · s3 키·날짜 계획", "SELECT range_id, ranges_json, keys_json, dates_json, saved_at FROM lake.lesson06.s06_demo_s3_plan ORDER BY saved_at, range_id"],
 ["6회차 · s3 성공 snapshot", "SELECT input_table, snapshot_id FROM lake.lesson06.s06_demo_s3_progress ORDER BY input_table"],
 ["6회차 · s5 원본 changes · o2 carry-over", "SELECT _change_type, _change_ordinal, _commit_snapshot_id, order_id, ordered_at, source_lsn FROM lake.lesson06.s06_demo_s5_orders.changes ORDER BY _change_ordinal, order_id, _change_type"],
 ["6회차 · s5 파일 재작성 snapshot", "SELECT committed_at, snapshot_id, parent_id, operation, summary['added-data-files'] added_data_files, summary['deleted-data-files'] deleted_data_files FROM lake.lesson06.s06_demo_s5_orders.snapshots ORDER BY committed_at, snapshot_id"],
 ["6회차 · s5 현재 데이터 파일", "SELECT file_path, record_count FROM lake.lesson06.s06_demo_s5_orders.files ORDER BY file_path"],
 ["6회차 · s4 일별 Gold · 환불 삭제", "SELECT * FROM lake.lesson06.s06_demo_s4_gold_daily ORDER BY order_date"],
 ["6회차 · s5 일별 Gold · 날짜 소급 정정", "SELECT * FROM lake.lesson06.s06_demo_s5_gold_daily ORDER BY order_date"],
 ["6회차 · s6 정상 일별 Gold", "SELECT * FROM lake.lesson06.s06_demo_s6_gold_daily ORDER BY order_date"],
 ["6회차 · s6 naive 일별 Gold", "SELECT * FROM lake.lesson06.s06_demo_naive_gold_daily ORDER BY order_date"],
 ["6회차 · s6 naive와 전체 재계산 차이", "WITH dim_order AS (\nSELECT order_id, ordered_at,\n       to_date(from_utc_timestamp(ordered_at, 'Asia/Seoul')) order_date, status\nFROM lake.lesson06.s06_demo_naive_orders WHERE NOT is_deleted\n),\nfct_payment AS (\nSELECT payment_id, order_id, amount, status\nFROM lake.lesson06.s06_demo_naive_payments WHERE NOT is_deleted\n),\nfct_refund AS (\nSELECT r.refund_id, r.payment_id, p.order_id, r.amount, r.status,\n       p.status payment_status\nFROM lake.lesson06.s06_demo_naive_refunds r LEFT JOIN fct_payment p ON r.payment_id=p.payment_id\nWHERE NOT r.is_deleted\n),\nfull_order AS (\nWITH payments AS (\n  SELECT order_id, sum(amount) paid FROM fct_payment\n  WHERE status='success' GROUP BY order_id\n), refunds AS (\n  SELECT order_id, sum(amount) refunded FROM fct_refund\n  WHERE status='success' AND payment_status='success' GROUP BY order_id\n)\nSELECT o.order_id, o.order_date,\n       coalesce(p.paid,0) paid, coalesce(r.refunded,0) refunded,\n       coalesce(p.paid,0)-coalesce(r.refunded,0) net_paid\nFROM dim_order o\nLEFT JOIN payments p ON o.order_id=p.order_id\nLEFT JOIN refunds r ON o.order_id=r.order_id\n),\nfull_daily AS (\nSELECT order_date, count(*) order_count, sum(paid) paid,\n       sum(refunded) refunded, sum(net_paid) net_paid\nFROM full_order GROUP BY order_date\n),\nactual_minus_full AS (SELECT order_date, order_count, paid, refunded, net_paid FROM lake.lesson06.s06_demo_naive_gold_daily EXCEPT SELECT order_date, order_count, paid, refunded, net_paid FROM full_daily),\nfull_minus_actual AS (SELECT order_date, order_count, paid, refunded, net_paid FROM full_daily EXCEPT SELECT order_date, order_count, paid, refunded, net_paid FROM lake.lesson06.s06_demo_naive_gold_daily)\nSELECT 'actual_minus_full' difference, order_date, order_count, paid, refunded, net_paid FROM actual_minus_full\nUNION ALL\nSELECT 'full_minus_actual' difference, order_date, order_count, paid, refunded, net_paid FROM full_minus_actual\nORDER BY order_date, difference"],
 ["7회차 · grow snapshot·메타데이터 비교", "SELECT 'plain' table_kind, 'snapshots' metric, count(*) item_count FROM lake.lesson07.s07_demo_grow_plain.snapshots UNION ALL SELECT 'plain' table_kind, 'metadata_log' metric, count(*) item_count FROM lake.lesson07.s07_demo_grow_plain.metadata_log_entries UNION ALL SELECT 'tuned' table_kind, 'snapshots' metric, count(*) item_count FROM lake.lesson07.s07_demo_grow_tuned.snapshots UNION ALL SELECT 'tuned' table_kind, 'metadata_log' metric, count(*) item_count FROM lake.lesson07.s07_demo_grow_tuned.metadata_log_entries"],
 ["7회차 · grow plain 최근 snapshot 5개", "SELECT committed_at, operation, summary['added-records'] added_records FROM lake.lesson07.s07_demo_grow_plain.snapshots ORDER BY committed_at DESC LIMIT 5"],
 ["7회차 · grow plain 데이터 파일 크기", "SELECT count(*) data_files, avg(file_size_in_bytes) avg_bytes FROM lake.lesson07.s07_demo_grow_plain.files"],
 ["7회차 · compact 현재 파일과 과거 파일", "SELECT 'plain' table_kind, 'files' metric, count(*) distinct_count FROM lake.lesson07.s07_demo_compact_plain.files UNION ALL SELECT 'plain' table_kind, 'all_data_files_distinct' metric, count(DISTINCT file_path) distinct_count FROM lake.lesson07.s07_demo_compact_plain.all_data_files UNION ALL SELECT 'tuned' table_kind, 'files' metric, count(*) distinct_count FROM lake.lesson07.s07_demo_compact_tuned.files UNION ALL SELECT 'tuned' table_kind, 'all_data_files_distinct' metric, count(DISTINCT file_path) distinct_count FROM lake.lesson07.s07_demo_compact_tuned.all_data_files"],
 ["7회차 · expire 남은 snapshot과 파일", "SELECT 'plain' table_kind, 'snapshots' metric, count(*) distinct_count FROM lake.lesson07.s07_demo_expire_plain.snapshots UNION ALL SELECT 'plain' table_kind, 'all_data_files_distinct' metric, count(DISTINCT file_path) distinct_count FROM lake.lesson07.s07_demo_expire_plain.all_data_files UNION ALL SELECT 'tuned' table_kind, 'snapshots' metric, count(*) distinct_count FROM lake.lesson07.s07_demo_expire_tuned.snapshots UNION ALL SELECT 'tuned' table_kind, 'all_data_files_distinct' metric, count(DISTINCT file_path) distinct_count FROM lake.lesson07.s07_demo_expire_tuned.all_data_files"],
 ["7회차 · clean 현재·전체 매니페스트", "SELECT 'plain' table_kind, 'manifests' metric, count(*) distinct_count FROM lake.lesson07.s07_demo_clean_plain.manifests UNION ALL SELECT 'plain' table_kind, 'all_manifests_distinct' metric, count(DISTINCT path) distinct_count FROM lake.lesson07.s07_demo_clean_plain.all_manifests UNION ALL SELECT 'tuned' table_kind, 'manifests' metric, count(*) distinct_count FROM lake.lesson07.s07_demo_clean_tuned.manifests UNION ALL SELECT 'tuned' table_kind, 'all_manifests_distinct' metric, count(DISTINCT path) distinct_count FROM lake.lesson07.s07_demo_clean_tuned.all_manifests"],
 ["7회차 · trap inc 남은 snapshot", "SELECT committed_at, snapshot_id, parent_id, operation FROM lake.lesson07.s07_demo_trap_inc.snapshots ORDER BY committed_at, snapshot_id"],
 ["7회차 · grow tuned 메타데이터 이력 · 최대 11개", "SELECT timestamp, file, latest_snapshot_id FROM lake.lesson07.s07_demo_grow_tuned.metadata_log_entries ORDER BY timestamp DESC"],
 ["8회차 · 층별 행 수 대조 (orders)", "SELECT '1 bronze.orders' layer, count(*) row_count FROM lake.bronze.orders UNION ALL SELECT '2 silver.orders' layer, count(*) row_count FROM lake.silver.orders UNION ALL SELECT '3 silver.dim_order' layer, count(*) row_count FROM lake.silver.dim_order UNION ALL SELECT '4 gold.mart_order_settlement' layer, count(*) row_count FROM lake.gold.mart_order_settlement"],
 ["8회차 · Gold 일별 정산", "SELECT order_date, order_count, paid, refunded, net_paid, mart_built_at FROM lake.gold.mart_daily_settlement ORDER BY order_date"],
 ["8회차 · Bronze가 보관한 Kafka 위치 (orders)", "SELECT topic, partition_id, min(kafka_offset) first_offset, max(kafka_offset) last_offset, count(*) row_count FROM lake.bronze.orders GROUP BY topic, partition_id"],
 ["8회차 · Bronze snapshot 수", "SELECT 'orders' bronze_table, count(*) snapshot_count FROM lake.bronze.orders.snapshots UNION ALL SELECT 'payments' bronze_table, count(*) snapshot_count FROM lake.bronze.payments.snapshots UNION ALL SELECT 'refunds' bronze_table, count(*) snapshot_count FROM lake.bronze.refunds.snapshots"],
 ["8회차 · Bronze 메타데이터 이력 수", "SELECT 'orders' bronze_table, count(*) metadata_files FROM lake.bronze.orders.metadata_log_entries UNION ALL SELECT 'payments' bronze_table, count(*) metadata_files FROM lake.bronze.payments.metadata_log_entries UNION ALL SELECT 'refunds' bronze_table, count(*) metadata_files FROM lake.bronze.refunds.metadata_log_entries"],
 ["8회차 · Bronze 최근 커밋과 Flink checkpoint", "SELECT committed_at, operation, summary['added-records'] added_records, summary['flink.max-committed-checkpoint-id'] flink_checkpoint_id FROM lake.bronze.orders.snapshots ORDER BY committed_at DESC LIMIT 5"],
 ["8회차 · Bronze 테이블 속성", "SHOW TBLPROPERTIES lake.bronze.orders"],
 ["8회차 · Bronze 최근 metadata.json 5개", "SELECT timestamp, file, latest_snapshot_id FROM lake.bronze.orders.metadata_log_entries ORDER BY timestamp DESC LIMIT 5"]
];
examples.forEach(([name,sql])=>{const b=button(name,()=>{$('editor').value=sql;$('editor').focus();});b.title=sql;$('examples').append(b);});
let recent=[];try{const saved=JSON.parse(localStorage.getItem('explorer.sql.history')||'[]');if(Array.isArray(saved))recent=saved.filter(x=>typeof x==='string').slice(0,20);}catch{}
function history(){const list=$('history');list.replaceChildren();recent.forEach(sql=>{const b=button(sql,()=>{$('editor').value=sql;$('editor').focus();});b.title=sql;list.append(b);});}
history();
async function run(){if($('run').disabled)return;const sql=$('editor').value;recent=[sql,...recent.filter(x=>x!==sql)].slice(0,20);try{localStorage.setItem('explorer.sql.history',JSON.stringify(recent));}catch{}history();$('run').disabled=true;$('sql-result').textContent='조회 중이에요.';const start=performance.now();$('elapsed').textContent='실행 중';const timer=setInterval(()=>{$('elapsed').textContent=((performance.now()-start)/1000).toFixed(1)+'초';},100);try{const data=await api('/api/sql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql,max_rows:Number($('max-rows').value)})});resultTable($('sql-result'),data);$('elapsed').textContent=(data.elapsed_ms/1000).toFixed(2)+'초';}catch(e){error($('sql-result'),e);$('elapsed').textContent=((performance.now()-start)/1000).toFixed(2)+'초';}finally{clearInterval(timer);$('run').disabled=false;}}
$('run').onclick=run;$('editor').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run();}});
let tableGeneration=0;
function options(select,values){select.replaceChildren(el('option','선택해 주세요'));select.firstChild.value='';values.forEach(v=>{const n=el('option',v);n.value=v;select.append(n);});}
function resetSections(){for(const id of ['snapshots','data-files','metadata-log'])$(id).textContent='테이블을 선택해 주세요.';}
async function loadNamespaces(){const generation=++tableGeneration;$('table-status').textContent='목록을 불러오고 있어요.';resetSections();options($('namespace'),[]);options($('table-name'),[]);try{const d=await api('/api/namespaces');if(generation!==tableGeneration)return;options($('namespace'),d.rows.map(r=>r[0]));namespacesLoaded=true;$('table-status').textContent=d.truncated?'앞 500개 네임스페이스만 보여요.':'';}catch(e){if(generation===tableGeneration)error($('table-status'),e);}}
$('namespace').onchange=async()=>{const generation=++tableGeneration;options($('table-name'),[]);resetSections();const ns=$('namespace').value;if(!ns)return;$('table-status').textContent='테이블을 불러오고 있어요.';try{const d=await api('/api/tables?'+new URLSearchParams({ns}));if(generation!==tableGeneration)return;const index=d.columns.findIndex(c=>c.toLowerCase()==='tablename');options($('table-name'),d.rows.map(r=>r[index<0?1:index]));$('table-status').textContent=d.truncated?'앞 500개 테이블만 보여요.':'';}catch(e){if(generation===tableGeneration)error($('table-status'),e);}};
$('table-name').onchange=async()=>{const generation=++tableGeneration,ns=$('namespace').value,name=$('table-name').value;resetSections();if(!ns||!name)return;$('table-status').textContent='테이블 정보를 불러오고 있어요.';for(const [section,id]of [['snapshots','snapshots'],['files','data-files'],['metadata-log','metadata-log']]){if(generation!==tableGeneration)return;$(id).textContent='조회 중이에요.';try{const d=await api(`/api/table/${encodeURIComponent(ns)}/${encodeURIComponent(name)}/${section}`);if(generation!==tableGeneration)return;resultTable($(id),d);}catch(e){if(generation===tableGeneration)error($(id),e);}}if(generation===tableGeneration)$('table-status').textContent='';};
$('reload-tables').onclick=loadNamespaces;
let prefix='',nextToken=null,pageTokens=[null],page=0,fileGeneration=0,previewGeneration=0;
function crumbs(){const root=$('breadcrumbs');root.replaceChildren(button('warehouse',()=>loadFiles('')));let current='';prefix.split('/').filter(Boolean).forEach(part=>{current+=part+'/';const target=current;root.append(el('span','/'),button(part,()=>loadFiles(target)));});}
async function loadFiles(newPrefix=prefix,token=null,paging=false){const generation=++fileGeneration;prefix=newPrefix;if(!paging){pageTokens=[null];page=0;}crumbs();$('file-list').textContent='목록을 불러오고 있어요.';$('next-page').hidden=$('previous-page').hidden=true;try{const d=await api('/api/files?'+new URLSearchParams({prefix,...(token?{token}:{})}));if(generation!==fileGeneration)return;filesLoaded=true;nextToken=d.next_token;const rows=[...d.folders.map(folder=>[folder,'폴더','',null]),...d.files.map(f=>[f.path,'파일',size(f.size),f.modified])];const target=$('file-list');target.replaceChildren();if(!rows.length)target.append(el('p','폴더가 비어 있어요.','empty'));else{const wrap=el('div',undefined,'table-scroll'),table=el('table'),head=el('thead'),heading=el('tr');['이름','종류','크기','수정 시각'].forEach(x=>heading.append(el('th',x)));head.append(heading);table.append(head);const body=el('tbody');rows.forEach(([path,kind,bytes,date])=>{const row=el('tr'),name=el('td');if(kind==='폴더'){const b=button(path.slice(prefix.length),()=>loadFiles(path));b.title=path;name.append(b);}else{const a=el('a',path.slice(('s3://warehouse/'+prefix).length),'path');a.href='#files';a.title=path;a.onclick=e=>{e.preventDefault();openPath(path);};name.append(a);}row.append(name,el('td',kind),el('td',bytes),el('td',date?new Date(date).toLocaleString('ko-KR'):''));body.append(row);});table.append(body);wrap.append(table);target.append(wrap);}$('next-page').hidden=!nextToken;$('previous-page').hidden=page===0;}catch(e){if(generation===fileGeneration)error($('file-list'),e);}}
$('next-page').onclick=()=>{if(!nextToken)return;pageTokens[++page]=nextToken;loadFiles(prefix,nextToken,true);};$('previous-page').onclick=()=>{if(page>0)loadFiles(prefix,pageTokens[--page],true);};$('reload-files').onclick=()=>loadFiles(prefix);
function size(bytes){return bytes<1024?bytes+' B':bytes<1024**2?(bytes/1024).toFixed(1)+' KB':(bytes/1024**2).toFixed(1)+' MB';}
async function openPath(path){const generation=++previewGeneration;filesLoaded=true;tab('files');const key=path.replace(/^s3a?:\/\/warehouse\//,'');loadFiles(key.includes('/')?key.slice(0,key.lastIndexOf('/')+1):'');const target=$('preview');target.textContent='파일을 읽고 있어요.';try{const d=await api('/api/file?'+new URLSearchParams({path}));if(generation!==previewGeneration)return;target.replaceChildren();const meta=el('div',undefined,'file-meta');meta.append(el('strong',d.path),el('p',`${size(d.size)} · ${new Date(d.modified).toLocaleString('ko-KR')}`,'muted'));target.append(meta);if(d.notice)target.append(el('p',d.notice,'notice'));if(d.kind==='json'){target.append(el('h2','메타데이터 요약'),jsonTree(d.summary));const all=el('details');all.append(el('summary','전체 JSON'),jsonTree(d.document));target.append(all);}else if(d.kind==='avro'){target.append(el('h2','Avro 레코드'));const records=el('div');recordTable(records,d.records);target.append(records);if(d.truncated)target.append(el('p','앞 200개 레코드만 보여요.','notice'));}else if(d.kind==='parquet'){target.append(el('h2',`Parquet · 전체 ${d.total_rows.toLocaleString('ko-KR')}행`),el('h3','스키마'),el('pre',d.schema));const groups=el('details');groups.append(el('summary',`행 그룹 ${d.row_groups.length}개`));d.row_groups.forEach(g=>{const group=el('details');group.append(el('summary',`그룹 ${g.row_group} · ${g.rows}행`));const stats=el('div');recordTable(stats,g.columns);group.append(stats);groups.append(group);});target.append(groups,el('h3','앞 50행'));const records=el('div');recordTable(records,d.records);target.append(records);}else if(d.text!==undefined)target.append(el('h2',d.kind==='hex'?'앞 4KB · Hex':'앞 4KB · 텍스트'),el('pre',d.text));}catch(e){if(generation===previewGeneration)error(target,e);}}
health();
